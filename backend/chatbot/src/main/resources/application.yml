spring:
  application:
    name: chatbot

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  base-url: http://localhost:5173

ai:
  service:
    url: http://localhost:8000
    internal-key: ${INTERNAL_API_KEY}

server:
  servlet:
    context-path: /api

mail:
  host: sandbox.smtp.mailtrap.io
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        ssl:
            trust: sandbox.smtp.mailtrap.io